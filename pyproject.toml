[project]
name = "audiobookshelf-rag-ingester"
version = "0.3.0"
description = "Audiobook and podcast source of the PDX Hackerspace RAG pipeline: Audiobookshelf into PostgreSQL and Qdrant."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Romkey" }]
# Keep in step with .python-version and the Dockerfile's python image.
requires-python = ">=3.15"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  # Audiobookshelf REST API, the model gateway, Open Library and Google Books.
  "httpx>=0.28.1",
  # Vector store.
  "qdrant-client>=1.20.0",
  # HTML descriptions to text.
  "beautifulsoup4>=4.15.0",
  # Staging store, entity registry and catalog table (shared PostgreSQL).
  "psycopg[binary]>=3.3.9",
  "alembic>=1.20.1",
  "sqlalchemy>=2.1.9",
  # A local .env for runs outside Docker.
  "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
# In-process embeddings instead of OpenAI. Large (PyTorch); not in the image.
sentence-transformers = ["sentence-transformers>=6.3.0"]

[project.urls]
Homepage = "https://github.com/romkey/audiobookshelf-rag-ingester"
Changelog = "https://github.com/romkey/audiobookshelf-rag-ingester/blob/main/CHANGELOG.md"
Issues = "https://github.com/romkey/audiobookshelf-rag-ingester/issues"

[project.scripts]
audiobookshelf-rag-ingester = "audiobookshelf_rag_ingester.__main__:main"

[dependency-groups]
dev = [
  "mypy>=2.4.1",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
# Same as the pipeline's other ingesters, which share several modules.
line-length = 100

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle, pyflakes
  "I",            # import order
  "N",            # naming
  "UP",           # modern syntax for requires-python
  "B",            # likely bugs
  "S",            # security
  "C4", "SIM", "RET", "PTH",
  "DTZ",          # timezone-aware datetimes
  "T20",          # no print(); use logging
  "LOG", "G",     # logging calls
  "PT",           # pytest style
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works
"scripts/**" = ["T20"]  # command-line tools print

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

# Optional extra, not installed in dev; has no stubs either way.
[[tool.mypy.overrides]]
module = ["sentence_transformers"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--cov", "--cov-report=term-missing", "--strict-markers"]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = [
  # Tests use Qdrant's in-memory mode, which ignores payload indexes.
  "ignore:Payload indexes have no effect:UserWarning",
]

[tool.coverage.run]
source = ["audiobookshelf_rag_ingester"]
branch = true
# Alembic loads migrations by path; tests/test_db.py runs them.
omit = ["*/audiobookshelf_rag_ingester/migrations/*"]

[tool.coverage.report]
fail_under = 95
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
